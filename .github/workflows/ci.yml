name: CI Pipeline

'on':
  push:
    branches:
      - main
      - staging
      - estagio
      - fabrica
      - 'fabrica/*'
      - 'feat/*'
      - 'feature/*'
  pull_request:
    branches:
      - main
      - staging
      - estagio
      - fabrica

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leilao_verzel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/leilao_verzel
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@localhost:5432/leilao_verzel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leilao_verzel
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ci_secret_jwt_key_test_2026
      HMAC_SECRET_KEY: ci_secret_hmac_chain_key_test_2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run test suite
        run: python -m pytest backend/tests -v

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Run unit tests
        run: npm --prefix frontend test

      - name: Run typecheck and production build
        run: npm --prefix frontend run build
